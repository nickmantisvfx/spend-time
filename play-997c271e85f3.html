<title>SPEND TIME</title>
<script>
// Version the complete bundle; a cached entry page can discover the new build.
window.SPEND_TIME_BUILD = '997c271e85f3';
window.spendTimeReleaseReady = (async () => {
  try {
    const response = await fetch('release.json?check='+Date.now(), {cache:'no-store',signal:AbortSignal.timeout(4000)});
    if (!response.ok) return true;
    const release = await response.json();
    if (/^[a-f0-9]{12}$/.test(release.id) && release.id!==window.SPEND_TIME_BUILD && release.entry==='play-'+release.id+'.html') {
      const next = new URL(release.entry, location.href);
      next.search = location.search;
      next.hash = location.hash;
      location.replace(next.href);
      return false;
    }
  } catch (_) { /* A network interruption must not erase or block a local save. */ }
  return true;
})();
</script>

</head><body>
<main id="app">

  </form>

<script>
const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"game-997c271e85f3","experimentalVK":false,"fileSizes":{"game-997c271e85f3.pck":44287932,"game-997c271e85f3.wasm":39514754},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4};
config.canvas = document.getElementById('canvas');
config.canvasResizePolicy = 0;
config.focusCanvas = false;
config.experimentalVK = false;
const engine = new Engine(config);
const missing = Engine.getMissingFeatures({threads:false});
function fail(error) {
  document.getElementById('load-status').textContent = window.spendTimeText('LOAD_ERROR');
  document.getElementById('retry').hidden = false;
  console.error(error);
}
if (missing.length) fail(missing.join(', '));
else window.spendTimeReleaseReady.then(currentBuild => currentBuild && engine.startGame({onProgress(current,total) {
  const progress = document.getElementById('load-progress');
  if (total > 0) { progress.max=total; progress.value=current; }
}}).then(()=>{document.getElementById('loading').hidden=true; SpendTime.ready();})).catch(fail);
</script></body></html>
