<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#cec4ab">
<title>SPEND TIME</title>
<link rel="stylesheet" href="telegram.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body>
<main id="app">
<canvas id="canvas" width="384" height="720" tabindex="0" aria-label="SPEND TIME game"></canvas>
<section id="editor" hidden aria-label="Text input">
  <header><button id="back" type="button" aria-label="Back">‹</button><h1 id="editor-title">YOUR FIRST DAY</h1></header>
  <div id="boss-choice"><p>CHOOSE YOUR BOSS</p><div class="bosses">
    <button type="button" data-boss="0" aria-label="Choose first boss"><canvas width="48" height="70"></canvas></button>
    <button type="button" data-boss="1" aria-label="Choose second boss"><canvas width="48" height="70"></canvas></button>
  </div></div>
  <div id="typing-task" hidden><div class="stats"><span>TIME <b id="seconds">30</b></span><span>WORDS <b id="correct">0</b></span></div><div id="word" aria-live="polite"></div></div>
  <form id="text-form" novalidate><label id="input-label" for="text-input">NAME YOUR OFFICE</label>
    <input id="text-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" maxlength="18" placeholder="Office name">
    <button id="submit" type="submit">OPEN COMPANY</button>
  </form>
  <p id="input-notice" role="status"></p>
  <p id="rent-help">Your first week is covered. Rent is 50 coins every seven days.</p>
</section>
<div id="loading" role="status"><h1>SPEND TIME</h1><p id="load-status">LOADING YOUR OFFICE…</p><progress id="load-progress"></progress><button id="retry" hidden onclick="location.reload()">RETRY</button></div>
</main>
<script src="telegram.js"></script>
<script src="index.js"></script>
<script>
const config = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":36183840,"index.wasm":39514754},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4};
config.canvas = document.getElementById('canvas');
config.canvasResizePolicy = 0;
config.focusCanvas = false;
config.experimentalVK = false;
const engine = new Engine(config);
const missing = Engine.getMissingFeatures({threads:false});
function fail(error) {
  document.getElementById('load-status').textContent = document.documentElement.lang==='ru' ? 'Не удалось запустить игру. Откройте её заново в обновлённом Telegram.' : 'Could not start the game. Please reopen it in an updated Telegram app.';
  document.getElementById('retry').hidden = false;
  console.error(error);
}
if (missing.length) fail(missing.join(', '));
else engine.startGame({onProgress(current,total) {
  const progress = document.getElementById('load-progress');
  if (total > 0) { progress.max=total; progress.value=current; }
}}).then(()=>{document.getElementById('loading').hidden=true; SpendTime.ready();}).catch(fail);
</script></body></html>
